name: logica_distribuida

# Una imagen para los cinco servicios
x-servicio-go: &servicio-go
  build: .
  image: logica_distribuida:local
  restart: unless-stopped

# Lo que comparten los tres módulos del backend
x-modulo: &modulo
  <<: *servicio-go
  environment: &modulo-env
    INSTANCIAS: "3"
    REGISTRO_URL: http://loadbalancer:8081/registrar
  depends_on:
    - loadbalancer

services:
  # Base de datos única
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: logica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Loadbalancer: registro, round-robin y health checks
  loadbalancer:
    <<: *servicio-go
    command: ["/app/loadbalancer"]
    environment:
      PUERTO: "8081"
    ports:
      - "8081:8081"

  # Tres instancias por módulo
  mundos:
    <<: *modulo
    command: ["/app/mundos"]
    environment:
      <<: *modulo-env
      HOST_ANUNCIO: mundos
      PUERTO_BASE: "9001"
    ports:
      - "9001-9003:9001-9003"

  tablas:
    <<: *modulo
    command: ["/app/tablas"]
    environment:
      <<: *modulo-env
      HOST_ANUNCIO: tablas
      PUERTO_BASE: "9011"
    ports:
      - "9011-9013:9011-9013"

  deduccion:
    <<: *modulo
    command: ["/app/deduccion"]
    environment:
      <<: *modulo-env
      HOST_ANUNCIO: deduccion
      PUERTO_BASE: "9021"
    ports:
      - "9021-9023:9021-9023"

  # Middleware público
  middleware:
    <<: *servicio-go
    command: ["/app/middleware"]
    environment:
      PUERTO: "8080"
      LOADBALANCER_URL: http://loadbalancer:8081
    depends_on:
      - loadbalancer
    ports:
      - "8080:8080"

  # Frontend
  frontend:
    <<: *servicio-go
    command: ["/app/frontend"]
    environment:
      PUERTO: "3000"
      DIRECTORIO_WEB: /app/web
      # Dirección del navegador, no la red interna de Docker
      MIDDLEWARE_PUBLICO: http://localhost:8080
    depends_on:
      - middleware
    ports:
      - "3000:3000"

volumes:
  postgres-datos:
