name: logica_distribuida

# Una imagen para los cinco servicios
x-servicio-go: &servicio-go
  build: .
  image: logica_distribuida:local
  restart: unless-stopped

# Lo que comparten los tres módulos del backend
x-modulo: &modulo
  <<: *servicio-go
  environment: &modulo-env
    INSTANCIAS: "3"
    REGISTRO_URL: http://loadbalancer:8081/registrar
    DB_HOST: postgres 
    DB_PORT: "5432"
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_NAME: logica 
  depends_on:
    loadbalancer:
      condition: service_started 
    postgres:
      condition: service_healthy 

services:
  # Base de datos única
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: logica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro 
    ports:
      - "5432:5432"

  # Loadbalancer: registro, round-robin y health checks
  loadbalancer:
    <<: *servicio-go
    command: ["/app/loadbalancer"]
    environment:
      PUERTO: "8081"
    ports:
      - "8081:8081"

  # Tres instancias por módulo
  mundos:
    <<: *modulo
    command: ["/app/mundos"]
    environment:
      <<: *modulo-env
      HOST_ANUNCIO: mundos
      PUERTO_BASE: "9001"
    ports:
      - "9001-9003:9001-9003"

  tablas:
    <<: *modulo
    command: ["/app/tablas"]
    environment:
      <<: *modulo-env
      HOST_ANUNCIO: tablas
      PUERTO_BASE: "9011"
    ports:
      - "9011-9013:9011-9013"

  deduccion:
    <<: *modulo
    command: ["/app/deduccion"]
    environment:
      <<: *modulo-env
      HOST_ANUNCIO: deduccion
      PUERTO_BASE: "9021"
    ports:
      - "9021-9023:9021-9023"

  # Marcar, registrar y mandar la API 
  middleware:
    <<: *servicio-go
    command: ["/app/middleware"]
    environment:
      PUERTO: "8080"
      LOADBALANCER_URL: http://loadbalancer:8081
    depends_on:
      - loadbalancer 

  # Frontend
  frontend:
    <<: *servicio-go
    command: ["/app/frontend"]
    environment:
      PUERTO: "3000"
      DIRECTORIO_WEB: /app/web

  # Recibir todo lo que manda el navegador
  nginx-gateway:
    build: ./nginx-gateway
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
        restart: true
      middleware:
        condition: service_started
        restart: true
    ports:
      - "8000:8000"

volumes:
  postgres-datos:
