name: logica_distribuida

# Una imagen para los cinco servicios
x-servicio-go: &servicio-go
  build: .
  image: logica_distribuida:local
  restart: unless-stopped

# Lo que comparten los tres módulos del backend
x-modulo: &modulo
  <<: *servicio-go
  environment: &modulo-env
    INSTANCIAS: "3"
    CONSUL_HTTP_ADDR: consul:8500
    DB_HOST: postgres 
    DB_PORT: "5432"
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_NAME: logica 
  depends_on:
    postgres:
      condition: service_healthy 
    consul:
      condition: service_started

services:
  # Base de datos única
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: logica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro 
    ports:
      - "5432:5432"

  # Consul para service discovery 
  consul: 
    image: hashicorp/consul:latest 
    restart: unless-stopped 
    command: "agent -dev -client=0.0.0.0 -ui"
    ports: 
      - "8500:8500"

  # Tres instancias por módulo
  mundos:
    <<: *modulo
    command: ["/app/mundos"]
    environment:
      <<: *modulo-env
      HOST_ANUNCIO: mundos
      PUERTO_BASE: "9001"
    ports:
      - "9001-9003:9001-9003"

  tablas:
    <<: *modulo
    command: ["/app/tablas"]
    environment:
      <<: *modulo-env
      HOST_ANUNCIO: tablas
      PUERTO_BASE: "9011"
    ports:
      - "9011-9013:9011-9013"

  deduccion:
    <<: *modulo
    command: ["/app/deduccion"]
    environment:
      <<: *modulo-env
      HOST_ANUNCIO: deduccion
      PUERTO_BASE: "9021"
    ports:
      - "9021-9023:9021-9023"

  # Marcar, registrar y mandar la API 
  middleware:
    <<: *servicio-go
    command: ["/app/middleware"]
    environment:
      PUERTO: "8080"
      GRPC_DESTINO: nginx-gateway:9000
      CONSUL_HTTP_ADDR: consul:8500
    depends_on:
      - consul

  # Frontend
  frontend:
    <<: *servicio-go
    command: ["/app/frontend"]
    environment:
      PUERTO: "3000"
      DIRECTORIO_WEB: /app/web

  # Recibir todo lo que manda el navegador
  nginx-gateway:
    build: ./nginx-gateway
    restart: unless-stopped
    environment:
      CONSUL_HTTP_ADDR: consul:8500 
    depends_on:
      consul:
        condition: service_started          
      frontend:
        condition: service_started
        restart: true
      middleware:
        condition: service_started
        restart: true
    ports:
      - "8000:8000" # Página y API 
      - "9000:9000" # gRPC 

volumes:
  postgres-datos:
