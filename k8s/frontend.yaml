apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: logica:local
          imagePullPolicy: Never
          command: ["/app/frontend"]
          ports:
            - containerPort: 3000
          env:
            # página compilada por el Dockerfile
            - name: DIRECTORIO_WEB
              value: /app/web
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
