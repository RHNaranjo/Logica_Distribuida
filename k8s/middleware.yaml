apiVersion: apps/v1
kind: Deployment
metadata:
  name: middleware
  labels:
    app: middleware
spec:
  # Guarda el conteo de peticiones atendidas en su memoria 
  # Sólo necesita una réplica
  replicas: 1
  selector:
    matchLabels:
      app: middleware
  template:
    metadata:
      labels:
        app: middleware
    spec:
      containers:
        - name: middleware
          image: logica:local
          imagePullPolicy: Never
          command: ["/app/middleware"]
          ports:
            - containerPort: 8080
          # Recibir tráfico sólo cuando /salud contesta 200
          readinessProbe:
            httpGet:
              path: /salud
              port: 8080
            periodSeconds: 5
          # Certificado de cliente para poder hablar con los módulos
          volumeMounts:
            - name: certs
              mountPath: /etc/ssl/certs/grpc
              readOnly: true 
      volumes:
        - name: certs 
          secret: 
            secretName: middleware-tls
---
# nginx habla por HTTP, no necesita ver los pods 
apiVersion: v1
kind: Service
metadata:
  name: middleware
spec:
  selector:
    app: middleware
  ports:
    - port: 8080
      targetPort: 8080
